[build]
  publish = "public"
  functions = "netlify/functions"

# Root serves the marketing page
[[redirects]]
  from = "/"
  to = "/marketing/index.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
