[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  # Default 10s is too tight for vision API calls
  [functions."course-from-photo"]
    external_node_modules = []
    included_files = []
    timeout = 26

  # People cleanup: monthly scheduled function (1st of month at 03:00 UTC)
  [functions."people-cleanup"]
    schedule = "0 3 1 * *"

  # Demo reset: nightly at 03:00 UK (02:00 UTC in summer, 03:00 UTC in winter)
  [functions."demo-reset"]
    schedule = "0 2 * * *"


[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Results page: SSR with OG tags
[[redirects]]
  from = "/r/:org/:event/og.png"
  to = "/.netlify/functions/results-og"
  status = 200

[[redirects]]
  from = "/r/:org/:event"
  to = "/.netlify/functions/results-page"
  status = 200
