workflows:
  oob-native:
    name: Out of Bounds — iOS & Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'

    integrations:
      app_store_connect: Out Of Bounds

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.outofboundsevents.scoring
      vars:
        BUNDLE_ID: com.outofboundsevents.scoring
        APP_BASE_URL: https://score.outofboundsevents.com
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Run engine tests
        script: node tests/engine.test.js

      - name: Sync Capacitor
        script: npx cap sync

      - name: Set up code signing
        script: |
          # Fetch signing files from App Store Connect
          app-store-connect fetch-signing-files \
            com.outofboundsevents.scoring \
            --type IOS_APP_STORE \
            --create
          # Install fetched profiles and certificates
          keychain initialize
          app-store-connect certificates list --type IOS_DISTRIBUTION --save || \
            app-store-connect certificates create --type IOS_DISTRIBUTION --save
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            | xcpretty

      - name: Package IPA
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App

      - name: Build Android
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/App.xcarchive
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Testers
