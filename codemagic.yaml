workflows:
  oob-native:
    name: Out of Bounds — iOS & Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'

    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.outofboundsevents.scoring
        APP_BASE_URL: https://score.outofboundsevents.com

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Run engine tests
        script: node tests/engine.test.js

      - name: Sync Capacitor
        script: npx cap sync

      - name: Set up iOS code signing
        script: |
          echo "Key ID set: ${APP_STORE_CONNECT_KEY_IDENTIFIER:+yes}"
          echo "Issuer set: ${APP_STORE_CONNECT_ISSUER_ID:+yes}"
          echo "Private key length: ${#APP_STORE_CONNECT_PRIVATE_KEY}"
          keychain initialize
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --verbose
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS and package IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"

      - name: Build Android
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - build/ios/ipa/*.ipa
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

      email:
        recipients:
          - karla.wentworth@thatsclevermx.com
        notify:
          success: true
          failure: true
