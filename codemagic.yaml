workflows:
  oob-native:
    name: Out of Bounds — iOS & Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'

    integrations:
      app_store_connect: Out Of Bounds

    environment:
      vars:
        BUNDLE_ID: com.outofboundsevents.scoring
        APP_BASE_URL: https://score.outofboundsevents.com
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Run engine tests
        script: node tests/engine.test.js

      - name: Sync Capacitor
        script: npx cap sync

      - name: Set up iOS code signing
        script: |
          keychain initialize
          # Create a new distribution certificate (generates key pair locally)
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --save
          # Now fetch signing files (profile will be created by --create)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS and package IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"

      - name: Build Android
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/App.xcarchive
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Testers
