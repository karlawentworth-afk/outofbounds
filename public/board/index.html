<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
:root {
  --primary: #1B2A4A;
  --accent: #2E7D32;
  --text-on-primary: #FFFFFF;
  --bg: #FFFFFF;
  --surface: #F8F9FA;
  --ink: #1A1A1A;
  --muted: #6B7280;
  --light: #9CA3AF;
  --rule: #E5E7EB;
  --accent-light: #E8F5E9;
  --leader: #1B5E20;
  --moved: #F0FFF4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

/* ── Header bar ── */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px;
  background: var(--primary); color: var(--text-on-primary);
}
.top-bar-left { display: flex; align-items: center; gap: 12px; }
.top-bar-left img { height: 32px; display: none; }
.top-bar-left .org-name { font-size: 13px; font-weight: 700; letter-spacing: 0.03em; }
.top-bar-right { display: flex; align-items: center; gap: 12px; }
.top-bar-right img { height: 24px; display: none; }
.top-bar-right .updated { font-size: 11px; opacity: 0.7; }

/* ── Event info ── */
.event-bar {
  padding: 16px 24px 12px; border-bottom: 1px solid var(--rule);
}
.event-title { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; color: var(--ink); }
.event-headline { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 2px; }
.event-format { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* ── Sponsor banner ── */
.sponsor-banner {
  display: none; padding: 0; border-bottom: 1px solid var(--rule);
  text-align: center; background: var(--surface);
}
.sponsor-banner img { max-height: 80px; max-width: 100%; }

/* ── Leaderboard heading ── */
.lb-heading {
  padding: 12px 24px 8px;
  font-size: 11px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--muted);
}

/* ── Table ── */
.board { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

.table-head {
  display: flex; align-items: center; padding: 8px 24px;
  background: var(--surface); border-bottom: 2px solid var(--rule);
  font-size: 10px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
}
.col-pos { width: 44px; text-align: center; }
.col-name { flex: 1; padding-left: 8px; }
.col-thru { width: 56px; text-align: center; }
.col-pts { width: 64px; text-align: center; }

.rows { flex: 1; overflow: hidden; }

.row {
  display: flex; align-items: center; padding: 0 24px; height: 44px;
  border-bottom: 1px solid var(--rule);
}
.row:nth-child(even) { background: var(--surface); }
.row.moved { background: var(--moved); }
.row.leader { border-left: 3px solid var(--accent); }

/* Position */
.pos {
  width: 44px; text-align: center; font-weight: 800; font-size: 14px;
  color: var(--muted);
}
.pos.p1 { color: var(--leader); font-size: 16px; }
.pos.p2 { color: var(--ink); }
.pos.p3 { color: var(--ink); }

/* Names */
.name-col { flex: 1; padding-left: 8px; overflow: hidden; }
.player-names {
  font-size: 14px; font-weight: 600; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row.leader .player-names { color: var(--leader); font-weight: 800; }
.cb { font-size: 9px; color: var(--light); margin-top: 1px; }

/* Through */
.thru { width: 56px; text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; }
.thru .fin {
  display: inline-block; padding: 1px 6px; border-radius: 3px;
  background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
}

/* Points */
.pts {
  width: 64px; text-align: center;
  font-size: 18px; font-weight: 900; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.row.leader .pts { color: var(--leader); }

/* ── Footer ── */
.footer-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 24px; border-top: 1px solid var(--rule);
  background: var(--surface);
}
.pager { font-size: 11px; color: var(--muted); font-weight: 600; }
.brand { font-size: 9px; color: var(--light); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

/* ── Empty / loading ── */
.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px; padding: 40px;
}
.empty-state .title { font-size: 16px; font-weight: 700; color: var(--ink); }
.empty-state .sub { font-size: 13px; color: var(--muted); }

/* ── Section title (secondary) ── */
.section-title {
  padding: 12px 24px 6px; font-size: 14px; font-weight: 800;
  color: var(--accent);
}

/* ── Sponsor slide ── */
.slide {
  display: none; flex: 1; flex-direction: column;
  align-items: center; justify-content: center; padding: 40px; text-align: center;
  background: var(--surface);
}
.slide.active { display: flex; }
.slide img { max-width: 50%; max-height: 40vh; margin-bottom: 24px; }
.slide .slide-headline { font-size: 28px; font-weight: 900; color: var(--ink); }
.slide .slide-message { font-size: 16px; color: var(--muted); margin-top: 8px; }

/* ── Tee times (before scores) ── */
.tee-row {
  display: flex; align-items: center; padding: 10px 24px;
  border-bottom: 1px solid var(--rule); font-size: 13px;
}
.tee-row:nth-child(even) { background: var(--surface); }
.tee-time { width: 60px; font-weight: 800; color: var(--accent); }
.tee-group { width: 80px; font-weight: 600; color: var(--muted); }
.tee-names { flex: 1; color: var(--ink); font-weight: 500; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-left">
    <img id="org-logo" alt="">
    <span class="org-name" id="orgName"></span>
  </div>
  <div class="top-bar-right">
    <img id="sponsor-logo" alt="">
    <span class="updated" id="updated"></span>
  </div>
</div>

<div class="event-bar">
  <div class="event-title" id="eventTitle"></div>
  <div class="event-headline" id="headline"></div>
  <div class="event-format" id="formatLine"></div>
</div>

<div class="lb-heading" id="lbHeading">Leaderboard</div>

<div class="board" id="board">
  <div class="empty-state">
    <div class="title">Loading...</div>
  </div>
</div>

<div class="footer-bar">
  <span class="pager" id="pager"></span>
  <span class="brand">Out of Bounds</span>
  <span class="updated" id="updated2"></span>
</div>

<script src="/shared/engine.js"></script>
<script src="/shared/api.js"></script>
<script>
(function () {
  'use strict';

  var parts = (location.hash || '').replace(/^#\/?/, '').split('/');
  var orgSlug = parts[0] || '';
  var eventSlug = parts[1] || '';

  if (!orgSlug || !eventSlug) {
    document.querySelector('.empty-state .title').textContent = 'No event specified';
    return;
  }

  var eventId = null;
  var slides = [];
  var prevRanks = {};
  var rowsPerPage = 15;
  var rotationItems = [];
  var rotationIndex = 0;
  var rotationTimer = null;
  var data = null;

  var FORMAT_LABELS = {
    'individual_stableford': 'Individual Stableford',
    'better_ball_pairs': 'Better ball pairs Stableford',
    'better_ball_2from4': 'Better ball Stableford \u2014 best 2 from 4'
  };

  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function init() {
    try {
      var config = await OOB.api('config-get', { query: { org: orgSlug, event: eventSlug } });
      var org = config.organiser || {};
      var ev = config.event || {};

      if (org.primary_colour) document.documentElement.style.setProperty('--primary', org.primary_colour);
      if (org.accent_colour) {
        document.documentElement.style.setProperty('--accent', org.accent_colour);
        document.documentElement.style.setProperty('--leader', org.accent_colour);
      }

      var logoEl = document.getElementById('org-logo');
      if (logoEl && org.logo_url) { logoEl.src = org.logo_url; logoEl.style.display = ''; }
      document.getElementById('orgName').textContent = org.name || '';
      document.getElementById('eventTitle').textContent = ev.name || '';

      var sponsorEl = document.getElementById('sponsor-logo');
      if (sponsorEl && ev.sponsor_logo_url) { sponsorEl.src = ev.sponsor_logo_url; sponsorEl.style.display = ''; }

      if (ev.headline_text) document.getElementById('headline').textContent = ev.headline_text;

      eventId = ev.id;
      rowsPerPage = ev.board_rows_per_page || 15;

      await refresh();
      setInterval(refresh, 30000);
      startRotation();
    } catch (err) {
      document.getElementById('board').innerHTML =
        '<div class="empty-state"><div class="title">Failed to load</div><div class="sub">' + esc(err.message) + '</div></div>';
    }
  }

  async function refresh() {
    if (!eventId) return;
    try {
      data = await OOB.api('leaderboard', { query: { event: eventId, mode: 'board' } });
      var t = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('updated').textContent = t;
      document.getElementById('updated2').textContent = 'Updated ' + t;
      buildRotation();
      renderCurrentView();
    } catch (err) { console.error(err); }
  }

  function buildRotation() {
    rotationItems = [];
    if (!data) return;
    var entries = (data.entries || []).filter(function (e) { return e.hasPlayed; });
    var totalPages = Math.max(1, Math.ceil(entries.length / rowsPerPage));

    for (var p = 0; p < totalPages; p++) {
      rotationItems.push({ type: 'leaderboard', page: p, entries: entries });
      if (slides.length > 0) rotationItems.push({ type: 'slide', slide: slides[p % slides.length] });
    }

    if (data.secondary && data.secondary.entries) {
      var sec = data.secondary.entries.filter(function (e) { return e.hasPlayed; });
      if (sec.length > 0) {
        var sp = Math.max(1, Math.ceil(sec.length / rowsPerPage));
        for (var i = 0; i < sp; i++) {
          rotationItems.push({ type: 'secondary', page: i, entries: sec, title: data.secondary.title });
        }
      }
    }
    if (rotationItems.length === 0) rotationItems.push({ type: 'empty' });
  }

  function startRotation() {
    rotationIndex = 0;
    renderCurrentView();
    clearInterval(rotationTimer);
    rotationTimer = setInterval(function () {
      rotationIndex = (rotationIndex + 1) % rotationItems.length;
      renderCurrentView();
    }, 12000);
  }

  function renderCurrentView() {
    if (!rotationItems.length) return;
    var item = rotationItems[rotationIndex];
    if (item.type === 'leaderboard') {
      document.getElementById('lbHeading').textContent = 'LEADERBOARD';
      renderBoard(item, data.format, data.allowancePct);
    } else if (item.type === 'secondary') {
      document.getElementById('lbHeading').textContent = item.title ? item.title.toUpperCase() : 'LEADERBOARD';
      renderBoard(item, data.secondary.format, data.secondary.allowancePct);
    } else if (item.type === 'slide') {
      renderSlide(item.slide);
    } else {
      renderEmpty();
    }
  }

  function renderBoard(item, format, pct) {
    var entries = item.entries;
    var page = item.page;
    var start = page * rowsPerPage;
    var pageEntries = entries.slice(start, start + rowsPerPage);
    var freezeHole = data ? data.freezeHole : 18;

    document.getElementById('formatLine').textContent =
      (FORMAT_LABELS[format] || format) + ', ' + pct + '% handicap allowance';

    var html = '<div class="table-head">' +
      '<div class="col-pos">Pos</div>' +
      '<div class="col-name">Player</div>' +
      '<div class="col-thru">Thru</div>' +
      '<div class="col-pts">Pts</div>' +
      '</div><div class="rows">';

    pageEntries.forEach(function (e, i) {
      var rank = start + i + 1;
      var key = e.memberIds.join(',');
      var moved = prevRanks[key] != null && prevRanks[key] !== rank;
      var isLeader = rank === 1;
      var finished = e.thru >= freezeHole;
      var posClass = rank <= 3 ? ' p' + rank : '';

      html += '<div class="row' + (moved ? ' moved' : '') + (isLeader ? ' leader' : '') + '">';
      html += '<div class="pos' + posClass + '">' + rank + '</div>';
      html += '<div class="name-col"><div class="player-names">' + esc(e.names) + '</div>';
      if (e.countback) html += '<div class="cb">' + esc(e.countback) + '</div>';
      html += '</div>';
      html += '<div class="thru">' + (finished ? '<span class="fin">F</span>' : e.thru) + '</div>';
      html += '<div class="pts">' + e.points + '</div>';
      html += '</div>';
    });

    html += '</div>';
    document.getElementById('board').innerHTML = html;

    var tp = Math.ceil(entries.length / rowsPerPage);
    document.getElementById('pager').textContent = tp > 1 ? 'Page ' + (page + 1) + ' of ' + tp : '';

    prevRanks = {};
    entries.forEach(function (e, i) { prevRanks[e.memberIds.join(',')] = i + 1; });
  }

  function renderSlide(slide) {
    if (!slide) return;
    var html = '<div class="slide active">';
    if (slide.image_url) html += '<img src="' + esc(slide.image_url) + '" alt="">';
    if (slide.headline) html += '<div class="slide-headline">' + esc(slide.headline) + '</div>';
    if (slide.message) html += '<div class="slide-message">' + esc(slide.message) + '</div>';
    html += '</div>';
    document.getElementById('board').innerHTML = html;
    document.getElementById('pager').textContent = '';
  }

  function renderEmpty() {
    if (!data || !data.entries || data.entries.length === 0) {
      document.getElementById('board').innerHTML =
        '<div class="empty-state"><div class="title">Waiting for scores</div><div class="sub">The leaderboard will appear when play begins</div></div>';
      return;
    }
    var html = '';
    data.entries.forEach(function (e) {
      var time = e.teeTime ? e.teeTime.slice(0, 5) : '';
      html += '<div class="tee-row"><span class="tee-time">' + esc(time) + '</span>' +
        '<span class="tee-group">Group ' + (e.groupNumber || '') + '</span>' +
        '<span class="tee-names">' + esc(e.names) + '</span></div>';
    });
    document.getElementById('board').innerHTML = html;
  }

  init();
})();
</script>
</body>
</html>
