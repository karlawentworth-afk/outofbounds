<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
:root {
  --primary: #1B2A4A;
  --accent: #2E7D32;
  --text-on-primary: #FFFFFF;
  --bg: #0A0E14;
  --surface: #141B24;
  --card: #1A2332;
  --ink: #F0F2F5;
  --muted: #7B8794;
  --rule: #243040;
  --gold: #FFD700;
  --silver: #C0C0C0;
  --bronze: #CD7F32;
  --highlight: rgba(46, 125, 50, 0.12);
  --glow-gold: rgba(255, 215, 0, 0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 40px 0; flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.header-left img { height: 40px; display: none; }
.header-right { display: flex; align-items: center; gap: 20px; }
.header-right img { height: 32px; display: none; opacity: 0.8; }

.event-name {
  font-size: 14px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--muted);
}
.event-title {
  font-size: 28px; font-weight: 900; letter-spacing: -0.02em;
  padding: 4px 40px 0; flex-shrink: 0;
}
.headline-bar {
  padding: 4px 40px 0; font-size: 14px; color: var(--accent);
  font-weight: 600; flex-shrink: 0;
}
.format-bar {
  padding: 8px 40px 16px; font-size: 12px; color: var(--muted);
  font-weight: 500; flex-shrink: 0;
  border-bottom: 1px solid var(--rule);
}

/* ── Board ── */
.board { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

.table-head {
  display: flex; align-items: center; padding: 12px 40px;
  font-size: 10px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.12em;
}
.col-pos { width: 52px; text-align: center; }
.col-name { flex: 1; }
.col-thru { width: 80px; text-align: center; }
.col-pts { width: 90px; text-align: right; padding-right: 8px; }

.rows { flex: 1; overflow: hidden; }

.row {
  display: flex; align-items: center; padding: 0 40px; height: 56px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: background 0.6s ease;
}
.row:nth-child(odd) { background: rgba(255,255,255,0.02); }
.row.moved { background: var(--highlight); }
.row.top3 { background: var(--glow-gold); }

/* Position badges */
.pos {
  width: 52px; text-align: center; font-weight: 900; font-size: 18px;
  color: var(--muted);
}
.pos-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 50%; font-size: 14px; font-weight: 900;
}
.pos-badge.p1 { background: var(--gold); color: #1a1a00; }
.pos-badge.p2 { background: var(--silver); color: #1a1a1a; }
.pos-badge.p3 { background: var(--bronze); color: #fff; }

/* Name column */
.name-col { flex: 1; padding: 0 8px; }
.player-names {
  font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cb { font-size: 10px; color: var(--muted); margin-top: 1px; font-weight: 500; }

/* Through column */
.thru {
  width: 80px; text-align: center; font-size: 13px;
  color: var(--muted); font-weight: 600;
}
.thru .finished {
  display: inline-block; padding: 2px 10px; border-radius: 10px;
  background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
  letter-spacing: 0.05em;
}

/* Points column */
.pts {
  width: 90px; text-align: right; padding-right: 8px;
  font-size: 26px; font-weight: 900; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.row.top3 .pts { color: var(--gold); }

/* ── Footer ── */
.footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 40px; border-top: 1px solid var(--rule); flex-shrink: 0;
}
.footer .pager { font-size: 12px; color: var(--muted); font-weight: 600; }
.footer .updated { font-size: 11px; color: var(--muted); }
.footer .powered {
  font-size: 10px; color: rgba(255,255,255,0.2); font-weight: 600;
  letter-spacing: 0.05em;
}

/* ── Empty state ── */
.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
}
.empty-state .title { font-size: 20px; font-weight: 700; }
.empty-state .sub { font-size: 14px; color: var(--muted); }

/* ── Sponsor slide ── */
.slide {
  display: none; flex: 1; flex-direction: column;
  align-items: center; justify-content: center; padding: 60px; text-align: center;
}
.slide.active { display: flex; }
.slide img { max-width: 50%; max-height: 40vh; margin-bottom: 32px; }
.slide .slide-headline { font-size: 36px; font-weight: 900; margin-bottom: 12px; }
.slide .slide-message { font-size: 18px; color: var(--muted); }

/* ── Section title for secondary ── */
.section-title {
  padding: 16px 40px 8px; font-size: 18px; font-weight: 800;
  color: var(--accent); letter-spacing: -0.01em;
  border-bottom: 1px solid var(--rule);
}

/* ── Tee time list (empty state) ── */
.tee-list { padding: 16px 40px; }
.tee-row {
  display: flex; align-items: center; padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 15px;
}
.tee-time { width: 70px; font-weight: 700; color: var(--accent); }
.tee-group { font-weight: 600; }
.tee-names { flex: 1; color: var(--muted); font-weight: 500; margin-left: 16px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img id="org-logo" alt="">
    <span class="event-name" id="event-name"></span>
  </div>
  <div class="header-right">
    <img id="sponsor-logo" alt="">
  </div>
</div>
<div class="event-title" id="eventTitle"></div>
<div class="headline-bar" id="headline"></div>
<div class="format-bar" id="formatLine"></div>

<div class="board" id="board">
  <div class="empty-state">
    <div class="title">Loading...</div>
  </div>
</div>

<div class="footer">
  <span class="pager" id="pager"></span>
  <span class="powered">OUT OF BOUNDS</span>
  <span class="updated" id="updated"></span>
</div>

<script src="/shared/engine.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/theme.js"></script>
<script>
(function () {
  'use strict';

  var parts = (location.hash || '').replace(/^#\/?/, '').split('/');
  var orgSlug = parts[0] || '';
  var eventSlug = parts[1] || '';

  if (!orgSlug || !eventSlug) {
    document.querySelector('.empty-state .title').textContent = 'No event specified';
    return;
  }

  var eventId = null;
  var slides = [];
  var prevRanks = {};
  var rowsPerPage = 15;
  var rotationItems = [];
  var rotationIndex = 0;
  var rotationTimer = null;
  var data = null;

  var FORMAT_LABELS = {
    'individual_stableford': 'Individual Stableford',
    'better_ball_pairs': 'Better ball pairs Stableford',
    'better_ball_2from4': 'Better ball Stableford — best 2 from 4'
  };

  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function init() {
    try {
      var config = await OOB.api('config-get', { query: { org: orgSlug, event: eventSlug } });
      var org = config.organiser || {};
      var ev = config.event || {};

      // Apply branding
      if (org.primary_colour) document.documentElement.style.setProperty('--primary', org.primary_colour);
      if (org.accent_colour) document.documentElement.style.setProperty('--accent', org.accent_colour);

      var logoEl = document.getElementById('org-logo');
      if (logoEl && org.logo_url) { logoEl.src = org.logo_url; logoEl.style.display = ''; }

      document.getElementById('event-name').textContent = org.name || '';
      document.getElementById('eventTitle').textContent = ev.name || '';

      var sponsorEl = document.getElementById('sponsor-logo');
      if (sponsorEl && ev.sponsor_logo_url) { sponsorEl.src = ev.sponsor_logo_url; sponsorEl.style.display = ''; }

      if (ev.headline_text) document.getElementById('headline').textContent = ev.headline_text;

      eventId = ev.id;
      rowsPerPage = ev.board_rows_per_page || 15;

      await refresh();
      setInterval(refresh, 30000);
      startRotation();
    } catch (err) {
      document.getElementById('board').innerHTML =
        '<div class="empty-state"><div class="title">Failed to load</div><div class="sub">' + esc(err.message) + '</div></div>';
    }
  }

  async function refresh() {
    if (!eventId) return;
    try {
      data = await OOB.api('leaderboard', { query: { event: eventId, mode: 'board' } });
      document.getElementById('updated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      buildRotation();
      renderCurrentView();
    } catch (err) {
      console.error('Refresh error:', err);
    }
  }

  function buildRotation() {
    rotationItems = [];
    if (!data) return;

    var entries = (data.entries || []).filter(function (e) { return e.hasPlayed; });
    var totalPages = Math.max(1, Math.ceil(entries.length / rowsPerPage));

    for (var p = 0; p < totalPages; p++) {
      rotationItems.push({ type: 'leaderboard', page: p, entries: entries });
      if (slides.length > 0) {
        rotationItems.push({ type: 'slide', slide: slides[p % slides.length] });
      }
    }

    // Secondary format
    if (data.secondary && data.secondary.entries) {
      var secEntries = data.secondary.entries.filter(function (e) { return e.hasPlayed; });
      if (secEntries.length > 0) {
        var secPages = Math.max(1, Math.ceil(secEntries.length / rowsPerPage));
        for (var sp = 0; sp < secPages; sp++) {
          rotationItems.push({ type: 'secondary', page: sp, entries: secEntries, title: data.secondary.title });
        }
      }
    }

    if (rotationItems.length === 0) {
      rotationItems.push({ type: 'empty' });
    }
  }

  function startRotation() {
    rotationIndex = 0;
    renderCurrentView();
    clearInterval(rotationTimer);
    rotationTimer = setInterval(function () {
      rotationIndex = (rotationIndex + 1) % rotationItems.length;
      renderCurrentView();
    }, 12000);
  }

  function renderCurrentView() {
    if (rotationItems.length === 0) return;
    var item = rotationItems[rotationIndex];
    if (item.type === 'leaderboard') {
      renderBoard(item, data.format, data.allowancePct, false);
    } else if (item.type === 'secondary') {
      renderBoard(item, data.secondary.format, data.secondary.allowancePct, true);
    } else if (item.type === 'slide') {
      renderSlide(item.slide);
    } else {
      renderEmpty();
    }
  }

  function renderBoard(item, format, allowancePct, isSecondary) {
    var entries = item.entries;
    var page = item.page;
    var start = page * rowsPerPage;
    var pageEntries = entries.slice(start, start + rowsPerPage);
    var freezeHole = data ? data.freezeHole : 18;

    document.getElementById('formatLine').textContent =
      (FORMAT_LABELS[format] || format) + ', ' + allowancePct + '% handicap allowance';

    var html = '';
    if (isSecondary) {
      html += '<div class="section-title">' + esc(item.title) + '</div>';
    }

    html += '<div class="table-head">' +
      '<div class="col-pos">Pos</div>' +
      '<div class="col-name">Name</div>' +
      '<div class="col-thru">Thru</div>' +
      '<div class="col-pts">Points</div>' +
      '</div><div class="rows">';

    pageEntries.forEach(function (e, i) {
      var rank = start + i + 1;
      var key = e.memberIds.join(',');
      var moved = prevRanks[key] != null && prevRanks[key] !== rank;
      var isTop3 = rank <= 3;
      var finished = e.thru >= freezeHole;

      var posHtml;
      if (rank <= 3) {
        var pc = rank === 1 ? 'p1' : rank === 2 ? 'p2' : 'p3';
        posHtml = '<span class="pos-badge ' + pc + '">' + rank + '</span>';
      } else {
        posHtml = rank;
      }

      html += '<div class="row' + (moved ? ' moved' : '') + (isTop3 ? ' top3' : '') + '">';
      html += '<div class="pos">' + posHtml + '</div>';
      html += '<div class="name-col"><div class="player-names">' + esc(e.names) + '</div>';
      if (e.countback) html += '<div class="cb">' + esc(e.countback) + '</div>';
      html += '</div>';
      html += '<div class="thru">' + (finished ? '<span class="finished">IN</span>' : e.thru) + '</div>';
      html += '<div class="pts">' + e.points + '</div>';
      html += '</div>';
    });

    html += '</div>';
    document.getElementById('board').innerHTML = html;

    var totalEntries = entries.length;
    var totalPages = Math.ceil(totalEntries / rowsPerPage);
    document.getElementById('pager').textContent =
      totalPages > 1 ? 'Page ' + (page + 1) + ' of ' + totalPages : '';

    // Store ranks for move detection
    prevRanks = {};
    entries.forEach(function (e, i) { prevRanks[e.memberIds.join(',')] = i + 1; });
  }

  function renderSlide(slide) {
    if (!slide) return;
    var html = '<div class="slide active">';
    if (slide.image_url) html += '<img src="' + esc(slide.image_url) + '" alt="">';
    if (slide.headline) html += '<div class="slide-headline">' + esc(slide.headline) + '</div>';
    if (slide.message) html += '<div class="slide-message">' + esc(slide.message) + '</div>';
    html += '</div>';
    document.getElementById('board').innerHTML = html;
    document.getElementById('pager').textContent = '';
  }

  function renderEmpty() {
    if (!data) return;
    var entries = data.entries || [];
    if (entries.length === 0) {
      document.getElementById('board').innerHTML =
        '<div class="empty-state"><div class="title">Waiting for scores</div><div class="sub">The leaderboard will appear when play begins</div></div>';
      return;
    }

    // Show tee times for groups not yet started
    var html = '<div class="tee-list">';
    entries.forEach(function (e) {
      var time = e.teeTime ? e.teeTime.slice(0, 5) : '';
      html += '<div class="tee-row">';
      html += '<span class="tee-time">' + esc(time) + '</span>';
      html += '<span class="tee-group">Group ' + (e.groupNumber || '') + '</span>';
      html += '<span class="tee-names">' + esc(e.names) + '</span>';
      html += '</div>';
    });
    html += '</div>';
    document.getElementById('board').innerHTML = html;
  }

  init();
})();
</script>
</body>
</html>
