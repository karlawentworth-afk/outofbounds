<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/components.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; touch-action: manipulation; }
body { background: var(--dark-bg); -webkit-font-smoothing: antialiased; }
.tv { width: 1920px; height: 1080px; display: flex; flex-direction: column; background: var(--dark-gradient); color: var(--dark-ink); transform-origin: top left; }
.tv .bar { height: 88px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; }
.tv .bar .org { display: flex; align-items: center; gap: 20px; font-family: var(--font-display); font-weight: 700; font-size: 30px; }
.tv .bar .org .ob-mark { width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,.14); background-image: url('/img/icon-white.png'); background-size: 36px; background-position: center; background-repeat: no-repeat; }
.tv .bar .org img { height: 44px; display: none; }
.tv .bar .clock { font-family: var(--font-score); font-weight: 600; font-size: 32px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 16px; }
.tv .bar .clock i { width: 14px; height: 14px; border-radius: 50%; background: var(--dark-accent); animation: pulse 1.8s infinite; }
.tv .title { padding: 32px 56px 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
.tv .title h1 { font-size: 56px; color: #fff; line-height: 1.05; font-family: var(--font-display); font-weight: 800; }
.tv .title .fmt { font-size: 26px; color: var(--dark-ink-muted); margin-top: 8px; }
.tv .title .lead { text-align: right; }
.tv .title .lead span { display: block; font-size: 22px; color: var(--dark-accent); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.tv .title .lead b { font-family: var(--font-display); font-size: 34px; color: #fff; }
.tv .grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0 56px; padding: 8px 56px 0; align-content: start; }
.tv .hd { display: grid; grid-template-columns: 90px 1fr 110px 130px; padding: 0 24px 10px; font-size: 20px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--dark-ink-muted); border-bottom: 2px solid var(--dark-line, rgba(255,255,255,.1)); }
.tv .hd span:nth-child(3) { text-align: center; } .tv .hd span:nth-child(4) { text-align: right; }
.tv .r { display: grid; grid-template-columns: 90px 1fr 110px 130px; align-items: center; height: 76px; padding: 0 24px; border-bottom: 1px solid var(--dark-line, rgba(255,255,255,.08)); font-variant-numeric: tabular-nums; }
.tv .r .pos { font-family: var(--font-score); font-weight: 700; font-size: 32px; color: var(--dark-ink-muted); }
.tv .r .nm { font-size: 32px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tv .r .th { text-align: center; font-size: 26px; color: var(--dark-ink-muted); font-weight: 600; }
.tv .r .th .fin { display: inline-block; background: var(--dark-accent); color: var(--dark-bg); font-weight: 700; font-size: 22px; padding: 2px 12px; border-radius: 6px; }
.tv .r .pt { text-align: right; font-family: var(--font-score); font-weight: 700; font-size: 44px; color: #fff; }
.tv .r.leader { background: rgba(143,211,164,.14); border-radius: 12px; border-bottom-color: transparent; }
.tv .r.leader .pos, .tv .r.leader .nm, .tv .r.leader .pt { color: var(--dark-accent); }
.tv .r.arrived { animation: nudge var(--dur-slow, .5s) var(--ease, ease); }
.tv .foot { height: 110px; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; border-top: 1px solid var(--dark-line, rgba(255,255,255,.08)); }
.tv .foot .scan { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--dark-ink-muted); }
.tv .foot .scan b { color: #fff; font-weight: 600; display: block; font-size: 24px; }
.tv .foot .pager { font-size: 24px; color: var(--dark-ink-muted); font-variant-numeric: tabular-nums; }
.tv .foot .scored { display: flex; align-items: center; gap: 14px; font-size: 20px; color: var(--dark-ink-muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.tv .foot .scored img { height: 30px; opacity: .5; }
/* Empty state */
.tv .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.tv .empty .title { font-size: 36px; font-weight: 700; color: #fff; font-family: var(--font-display); }
.tv .empty .sub { font-size: 24px; color: var(--dark-ink-muted); }
/* Tee times */
.tv .tees { flex: 1; padding: 0 56px; overflow: hidden; }
.tv .tee { display: grid; grid-template-columns: 90px 120px 1fr; align-items: center; height: 60px; padding: 0 24px; border-bottom: 1px solid var(--dark-line, rgba(255,255,255,.08)); font-size: 26px; }
.tv .tee .time { font-weight: 700; color: var(--dark-accent); font-variant-numeric: tabular-nums; }
.tv .tee .gn { font-weight: 600; color: var(--dark-ink-muted); }
.tv .tee .names { color: #fff; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="tv on-dark" id="tv">
  <div class="bar">
    <div class="org"><span class="ob-mark" aria-hidden="true"></span><img id="org-logo" alt=""><span id="orgName"></span></div>
    <div class="clock"><i></i><span id="clock"></span></div>
  </div>
  <div class="title">
    <div><h1 id="eventTitle"></h1><div class="fmt" id="formatLine"></div></div>
    <div class="lead" id="leadLine" style="display:none"><span>Leading</span><b id="leadText"></b></div>
  </div>
  <div class="grid" id="board">
    <div class="empty"><div class="title">Loading...</div></div>
  </div>
  <div class="foot">
    <div class="scan" id="scanArea"></div>
    <div class="pager" id="pager"></div>
    <div class="scored"><img src="/img/icon-white.png" alt="OB"> Scored with Out of Bounds</div>
  </div>
</div>

<script src="/shared/engine.js"></script>
<script src="/shared/api.js"></script>
<script>
(function () {
  'use strict';

  var parts = (location.hash || '').replace(/^#\/?/, '').split('/');
  var orgSlug = parts[0] || '';
  var eventSlug = parts[1] || '';

  if (!orgSlug || !eventSlug) {
    document.querySelector('.empty-state .title').textContent = 'No event specified';
    return;
  }

  // Demo switcher for superadmin
  if (localStorage.getItem('oob-superadmin') === 'true' && OOB.showDemoSwitcher) OOB.showDemoSwitcher();

  // Wake Lock — keep the screen on
  var wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', function () { wakeLock = null; });
      }
    } catch (e) { /* not supported or denied */ }
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
  });

  // Hide cursor after 5 seconds of no movement
  var cursorTimer = null;
  document.addEventListener('mousemove', function () {
    document.body.style.cursor = '';
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(function () {
      document.body.style.cursor = 'none';
    }, 5000);
  });
  cursorTimer = setTimeout(function () { document.body.style.cursor = 'none'; }, 5000);

  var eventId = null;
  var slides = [];
  var prevRanks = {};
  var rowsPerPage = 15;
  var rotationItems = [];
  var rotationIndex = 0;
  var rotationTimer = null;
  var data = null;

  var FORMAT_LABELS = {
    'individual_stableford': 'Individual Stableford',
    'better_ball_pairs': 'Better ball pairs Stableford',
    'better_ball_2from4': 'Better ball Stableford, best 2 from 4'
  };

  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Fit the 1920x1080 canvas to any window
  function fit() { var s = Math.min(innerWidth/1920, innerHeight/1080); document.getElementById('tv').style.transform = 'scale(' + s + ')'; }
  fit(); addEventListener('resize', fit);

  // Clock
  function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
  updateClock(); setInterval(updateClock, 30000);

  async function init() {
    try {
      var config = await OOB.api('config-get', { query: { org: orgSlug, event: eventSlug } });
      if (OOB.showTestBanner) OOB.showTestBanner(config.test_mode);
      var org = config.organiser || {};
      var ev = config.event || {};

      if (org.primary_colour) document.documentElement.style.setProperty('--brand', org.primary_colour);

      var logoEl = document.getElementById('org-logo');
      if (logoEl && org.logo_url) { logoEl.src = org.logo_url; logoEl.style.display = 'block'; }
      document.getElementById('orgName').textContent = org.display_name || org.name || '';
      document.getElementById('eventTitle').textContent = ev.name || '';

      eventId = ev.id;
      rowsPerPage = ev.board_rows_per_page || 9;

      await refresh();
      setInterval(refresh, 30000);
      startRotation();
    } catch (err) {
      document.getElementById('board').innerHTML =
        '<div class="empty"><div class="title">That didn\u2019t work</div><div class="sub">Check the link and try again.</div></div>';
    }
  }

  async function refresh() {
    if (!eventId) return;
    try {
      data = await OOB.api('leaderboard', { query: { event: eventId, mode: 'board' } });
      updateClock();
      buildRotation();
      renderCurrentView();
    } catch (err) { console.error(err); }
  }

  function buildRotation() {
    rotationItems = [];
    if (!data) return;
    var entries = (data.entries || []).filter(function (e) { return e.hasPlayed; });
    var totalPages = Math.max(1, Math.ceil(entries.length / rowsPerPage));

    for (var p = 0; p < totalPages; p++) {
      rotationItems.push({ type: 'leaderboard', page: p, entries: entries });
      if (slides.length > 0) rotationItems.push({ type: 'slide', slide: slides[p % slides.length] });
    }

    if (data.secondary && data.secondary.entries) {
      var sec = data.secondary.entries.filter(function (e) { return e.hasPlayed; });
      if (sec.length > 0) {
        var sp = Math.max(1, Math.ceil(sec.length / rowsPerPage));
        for (var i = 0; i < sp; i++) {
          rotationItems.push({ type: 'secondary', page: i, entries: sec, title: data.secondary.title });
        }
      }
    }
    if (rotationItems.length === 0) rotationItems.push({ type: 'empty' });
  }

  function startRotation() {
    rotationIndex = 0;
    renderCurrentView();
    clearInterval(rotationTimer);
    rotationTimer = setInterval(function () {
      rotationIndex = (rotationIndex + 1) % rotationItems.length;
      renderCurrentView();
    }, 12000);
  }

  function renderCurrentView() {
    if (!rotationItems.length) return;
    var item = rotationItems[rotationIndex];
    if (item.type === 'leaderboard') {
      renderBoard(item, data.format, data.allowancePct);
    } else if (item.type === 'secondary') {
      renderBoard(item, data.secondary.format, data.secondary.allowancePct);
    } else if (item.type === 'slide') {
      renderSlide(item.slide);
    } else {
      renderEmpty();
    }
  }

  function renderBoard(item, format, pct) {
    var entries = item.entries;
    var page = item.page;
    var start = page * rowsPerPage;
    var pageEntries = entries.slice(start, start + rowsPerPage);
    var freezeHole = data ? data.freezeHole : 18;
    var colLabel = format === 'individual_stableford' ? 'Player' : 'Team';

    document.getElementById('formatLine').textContent =
      (FORMAT_LABELS[format] || format) + ' \u00B7 ' + pct + '% handicap allowance';

    // Leader line
    if (entries.length > 0) {
      var leader = entries[0];
      document.getElementById('leadLine').style.display = '';
      document.getElementById('leadText').textContent = leader.names + ', ' + leader.points + ' pts thru ' + leader.thru;
    }

    // Split into two columns
    var half = Math.ceil(pageEntries.length / 2);
    var col1 = pageEntries.slice(0, half);
    var col2 = pageEntries.slice(half);

    function renderCol(arr, startIdx) {
      var h = '<div><div class="hd"><span>Pos</span><span>' + colLabel + '</span><span>Thru</span><span>Pts</span></div>';
      arr.forEach(function (e, i) {
        var rank = startIdx + i + 1;
        var key = e.memberIds.join(',');
        var moved = prevRanks[key] != null && prevRanks[key] !== rank;
        var isLeader = rank === 1;
        var finished = e.thru >= freezeHole;

        h += '<div class="r' + (moved ? ' arrived' : '') + (isLeader ? ' leader' : '') + '">';
        h += '<span class="pos">' + rank + '</span>';
        h += '<span class="nm">' + esc(e.names) + '</span>';
        h += '<span class="th">' + (finished ? '<span class="fin">F</span>' : e.thru) + '</span>';
        h += '<span class="pt">' + e.points + '</span>';
        h += '</div>';
      });
      h += '</div>';
      return h;
    }

    var html = renderCol(col1, start) + renderCol(col2, start + half);
    document.getElementById('board').innerHTML = html;

    var tp = Math.ceil(entries.length / rowsPerPage);
    var t = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('pager').textContent = (tp > 1 ? 'Page ' + (page + 1) + ' of ' + tp + ' \u00B7 ' : '') + 'Updated ' + t;

    prevRanks = {};
    entries.forEach(function (e, i) { prevRanks[e.memberIds.join(',')] = i + 1; });
  }

  function renderSlide(slide) {
    if (!slide) return;
    var html = '<div style="grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">';
    if (slide.image_url) html += '<img src="' + esc(slide.image_url) + '" alt="" style="max-width:50%;max-height:40%;margin-bottom:32px;">';
    if (slide.headline) html += '<div style="font-size:48px;font-weight:800;color:#fff;font-family:var(--font-display);">' + esc(slide.headline) + '</div>';
    if (slide.message) html += '<div style="font-size:28px;color:var(--dark-ink-muted);margin-top:12px;">' + esc(slide.message) + '</div>';
    html += '</div>';
    document.getElementById('board').innerHTML = html;
    document.getElementById('pager').textContent = '';
  }

  function renderEmpty() {
    if (!data || !data.entries || data.entries.length === 0) {
      document.getElementById('board').innerHTML =
        '<div class="empty"><div class="title">Waiting for scores</div><div class="sub">The leaderboard will appear when play begins</div></div>';
      return;
    }
    var html = '<div class="tees" style="grid-column:1/-1">';
    data.entries.forEach(function (e) {
      var time = e.teeTime ? e.teeTime.slice(0, 5) : '';
      html += '<div class="tee"><span class="time">' + esc(time) + '</span>' +
        '<span class="gn">Group ' + (e.groupNumber || '') + '</span>' +
        '<span class="names">' + esc(e.names) + '</span></div>';
    });
    html += '</div>';
    document.getElementById('board').innerHTML = html;
  }

  init();
})();
</script>
</body>
</html>
