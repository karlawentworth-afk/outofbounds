<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing in — Out of Bounds</title>
<style>
body { font-family: Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #10344E; color: #fff; text-align: center; }
.wrap { max-width: 360px; padding: 32px 24px; }
h2 { font-size: 20px; margin-bottom: 12px; }
p { font-size: 15px; color: rgba(255,255,255,0.7); }
.done-btn { display: inline-block; margin-top: 20px; padding: 14px 32px; background: #2F7A45; color: #fff; border-radius: 999px; font-weight: 600; font-size: 16px; text-decoration: none; font-family: inherit; border: none; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h2 id="heading">Signing you in…</h2>
  <p id="msg">You can close this window and return to the app.</p>
  <button class="done-btn" id="done-btn" style="display:none" onclick="window.close()">Return to Out of Bounds</button>
</div>
<script>
(function () {
  var hash = window.location.hash.substring(1);
  var params = new URLSearchParams(hash);
  var accessToken = params.get('access_token');
  var refreshToken = params.get('refresh_token');

  // Get session key from query string
  var qp = new URLSearchParams(window.location.search);
  var session = qp.get('session');

  if (!accessToken) {
    var error = qp.get('error_description') || qp.get('error');
    if (error) {
      document.getElementById('heading').textContent = 'Sign-in failed';
      document.getElementById('msg').textContent = error;
    } else {
      // No tokens, no error — redirect to /o/ (web flow)
      window.location.replace('/o/');
    }
    return;
  }

  if (session) {
    // Native app flow: store tokens server-side with the session key
    // The main app is polling for this
    fetch('/.netlify/functions/auth-exchange', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code: session,
        access_token: accessToken,
        refresh_token: refreshToken || ''
      })
    }).then(function () {
      document.getElementById('heading').textContent = 'Signed in!';
      document.getElementById('msg').textContent = 'Returning to the app…';
      // Try multiple close methods
      window.close();
      setTimeout(function () { window.close(); }, 500);
      setTimeout(function () { window.close(); }, 1000);
      // Final fallback: redirect to /o/ after 2 seconds
      setTimeout(function () { window.location.replace('/o/'); }, 2000);
    }).catch(function () {
      // Even on error, redirect back
      setTimeout(function () { window.location.replace('/o/'); }, 1000);
    });
  } else {
    // Web flow: redirect to /o/ with tokens in hash so Supabase client picks them up
    window.location.replace('/o/' + window.location.hash);
  }
})();
</script>
</body>
</html>
