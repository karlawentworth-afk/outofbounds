<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing in — Out of Bounds</title>
<style>
body { font-family: Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #10344E; color: #fff; text-align: center; }
.wrap { max-width: 360px; padding: 32px 24px; }
h2 { font-size: 20px; margin-bottom: 12px; }
p { font-size: 15px; color: rgba(255,255,255,0.7); }
</style>
</head>
<body>
<div class="wrap">
  <h2 id="heading">Signing you in…</h2>
  <p id="msg">You'll be redirected in a moment.</p>
</div>
<script>
(function () {
  var hash = window.location.hash.substring(1);
  var params = new URLSearchParams(hash);
  var accessToken = params.get('access_token');
  var refreshToken = params.get('refresh_token');

  if (!accessToken) {
    // Check query params (some flows put tokens there)
    var qp = new URLSearchParams(window.location.search);
    var error = qp.get('error_description') || qp.get('error');
    if (error) {
      document.getElementById('heading').textContent = 'Sign-in failed';
      document.getElementById('msg').textContent = error;
    } else {
      window.location.replace('/o/');
    }
    return;
  }

  // Store tokens server-side with a one-time code
  fetch('/.netlify/functions/auth-exchange', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ access_token: accessToken, refresh_token: refreshToken || '' })
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (data.code) {
      // Redirect via universal link — the app intercepts this
      window.location.replace('https://score.outofboundsevents.com/o/?auth_code=' + data.code);
    } else {
      // Fallback: set cookies and redirect
      document.cookie = 'sb-access-token=' + accessToken + '; path=/; max-age=7776000; SameSite=Lax';
      if (refreshToken) document.cookie = 'sb-refresh-token=' + refreshToken + '; path=/; max-age=7776000; SameSite=Lax';
      window.location.replace('/o/');
    }
  })
  .catch(function () {
    // Fallback: set cookies and redirect (works on web)
    document.cookie = 'sb-access-token=' + accessToken + '; path=/; max-age=7776000; SameSite=Lax';
    if (refreshToken) document.cookie = 'sb-refresh-token=' + refreshToken + '; path=/; max-age=7776000; SameSite=Lax';
    window.location.replace('/o/');
  });
})();
</script>
</body>
</html>
