<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Out of Bounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap">
<style>
:root {
  --navy: #10344E;
  --green: #2F7A45;
  --off-white: #F7F5F0;
  --white: #FFFFFF;
  --muted: #5B6672;
  --line: #E3E7EB;
  --ink: #1B2430;
  --amber: #E0A800;
  --green-light: #E8F5E9;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100dvh; overflow: hidden;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--off-white); color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  font-variant-numeric: tabular-nums;
}

/* Screens */
.screen { display: none; height: 100dvh; flex-direction: column; overflow: hidden; }
.screen.active { display: flex; }

/* Top bar — 56px */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; min-height: 56px; padding: 0 16px;
  background: var(--navy); color: #fff; position: relative; z-index: 50;
}
.top-bar .ev-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
.top-bar .tabs { display: flex; gap: 0; }
.top-bar .tab {
  padding: 8px 14px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6);
  border: none; background: none; cursor: pointer; position: relative; font-family: inherit;
}
.top-bar .tab.active { color: #fff; }
.top-bar .tab.active::after {
  content: ''; position: absolute; bottom: -2px; left: 14px; right: 14px;
  height: 3px; background: var(--green); border-radius: 2px;
}
.top-bar .org-logo { height: 28px; display: none; }

/* Hole bar — 64px */
.hole-bar {
  display: flex; align-items: center; justify-content: space-between;
  height: 64px; min-height: 64px; padding: 0 12px;
  background: var(--white); border-bottom: 1px solid var(--line);
}
.hole-bar .arrow {
  width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 600; color: var(--ink); cursor: pointer;
  border: none; background: none; font-family: inherit;
  user-select: none; -webkit-user-select: none; white-space: nowrap;
}
.hole-bar .arrow[disabled] { opacity: 0.25; pointer-events: none; }
.hole-bar .hole-centre { text-align: center; flex: 1; }
.hole-bar .hole-num { font-family: 'Poppins', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.1; }
.hole-bar .hole-meta { font-size: 12px; color: var(--muted); font-weight: 400; }

/* Player rows — 56px each (48px under 700px height), hairline dividers */
.player-rows { background: var(--white); flex-shrink: 0; }
.player-row {
  display: flex; align-items: center; height: var(--row-h, 56px);
  padding: 0 16px; border-bottom: 1px solid var(--line);
  cursor: pointer; position: relative;
}
.player-row.selected { background: var(--green-light); border-left: 3px solid var(--green); padding-left: 13px; }
.player-row .p-name { flex: 1; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.player-row .p-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.player-row .shot-dots { display: flex; gap: 3px; align-items: center; }
.shot-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.shot-dots .extra { font-size: 10px; font-weight: 700; color: var(--green); }
.score-box {
  width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; background: var(--off-white); color: var(--ink); border: 1px solid var(--line);
  font-variant-numeric: tabular-nums; position: relative;
}
.score-box.has-val { background: var(--green); color: #fff; border-color: var(--green); }
.score-box.pickup { background: var(--muted); color: #fff; border-color: var(--muted); font-size: 18px; }

/* HCP tooltip — shown on name tap for 2s */
.hcp-tooltip {
  position: absolute; left: 16px; bottom: -18px; z-index: 10;
  background: var(--navy); color: #fff; font-size: 11px; font-weight: 500;
  padding: 3px 8px; border-radius: 4px; white-space: nowrap;
  opacity: 0; transition: opacity 0.15s;
  pointer-events: none;
}
.hcp-tooltip.show { opacity: 1; }

/* Blinking cursor for selected empty score box */
.player-row.selected .score-box:not(.has-val):not(.pickup)::after {
  content: ''; position: absolute; width: 2px; height: 22px; background: var(--green);
  animation: blink 1s step-end infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* Status line — 28px */
.status-line {
  display: flex; align-items: center; justify-content: space-between;
  height: 28px; min-height: 28px; padding: 0 16px;
  font-size: 13px; color: var(--muted); font-weight: 400;
  background: var(--white); border-bottom: 1px solid var(--line);
}
.status-line.pending { background: var(--amber); color: #fff; }
.status-line .sl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-line .sr { white-space: nowrap; flex-shrink: 0; margin-left: 8px; }

/* Keypad — fills remaining height */
.keypad-wrap { flex: 1; display: flex; flex-direction: column; background: var(--white); min-height: 0; }
.keypad {
  flex: 1; display: grid; grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr); padding: 0; min-height: 0;
}
.kp-key {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 600; font-family: 'Inter', sans-serif;
  background: var(--white); color: var(--ink); border: none; cursor: pointer;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  user-select: none; -webkit-user-select: none;
  min-height: var(--key-h, 52px); font-variant-numeric: tabular-nums;
}
.kp-key:nth-child(3n) { border-right: none; }
.kp-key:nth-child(n+10) { border-bottom: none; }
.kp-key:active { background: var(--off-white); }
.kp-key .kp-sub { font-size: 10px; font-weight: 500; color: var(--muted); margin-top: 1px; }

/* Save bar — 56px + safe area */
.save-bar {
  height: calc(56px + env(safe-area-inset-bottom, 0px));
  min-height: calc(56px + env(safe-area-inset-bottom, 0px));
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--green); color: #fff; font-size: 17px; font-weight: 700;
  font-family: inherit; border: none; cursor: pointer; width: 100%;
  padding: 0 16px; padding-bottom: env(safe-area-inset-bottom, 0px);
}
.save-bar[disabled] { background: #94A3B8; cursor: default; }
.save-bar:active:not([disabled]) { opacity: 0.9; }

/* Small screens: shrink rows and keys to fit */
@media (max-height: 699px) {
  :root { --row-h: 48px; --key-h: 44px; }
  .top-bar { height: 48px; min-height: 48px; }
  .hole-bar { height: 56px; min-height: 56px; }
  .hole-bar .hole-num { font-size: 24px; }
  .status-line { height: 24px; min-height: 24px; font-size: 12px; }
  .save-bar { height: calc(48px + env(safe-area-inset-bottom, 0px)); min-height: calc(48px + env(safe-area-inset-bottom, 0px)); font-size: 15px; }
  .kp-key { font-size: 20px; }
  .player-row .p-name { font-size: 14px; }
  .score-box { width: 38px; height: 38px; font-size: 18px; }
}

/* Non-scorer passive view */
.passive-area {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px 24px; text-align: center; gap: 16px; background: var(--white);
}
.passive-area .pa-text { font-size: 16px; font-weight: 500; color: var(--muted); line-height: 1.5; }
.passive-area .pa-link { font-size: 14px; color: var(--green); font-weight: 600; cursor: pointer; border: none; background: none; font-family: inherit; text-decoration: underline; }

/* Welcome screen */
.welcome-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; overflow-y: auto; }
.w-greeting { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
.w-event { font-size: 15px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
.w-detail { font-size: 15px; color: var(--ink); font-weight: 400; margin-bottom: 4px; line-height: 1.5; }
.w-hcp { font-size: 14px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
.btn-go {
  display: block; width: 100%; padding: 18px; margin-top: 28px;
  background: var(--green); color: #fff; border: none; border-radius: 14px;
  font-size: 18px; font-weight: 700; font-family: inherit; cursor: pointer; text-align: center;
}
.btn-go:active { opacity: 0.9; }
.w-notright { display: block; text-align: center; margin-top: 14px; font-size: 13px; color: var(--muted); cursor: pointer; border: none; background: none; font-family: inherit; }

/* HCP editor */
.hcp-editor { margin-top: 16px; padding: 16px; background: var(--off-white); border-radius: 10px; }
.hcp-editor label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.hcp-editor input {
  width: 100px; padding: 10px 14px; font-size: 18px; font-weight: 700;
  border: 2px solid var(--line); border-radius: 8px; text-align: center;
  font-family: inherit; outline: none;
}
.hcp-editor input:focus { border-color: var(--green); }
.hcp-editor .hcp-note { font-size: 11px; color: var(--muted); margin-top: 8px; }

/* Nomination screen */
.nom-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px; gap: 12px; }
.nom-title { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 8px; }
.nom-btn {
  display: block; width: 100%; height: 64px; background: var(--white); border: 2px solid var(--line);
  border-radius: 12px; font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer;
  color: var(--ink); text-align: center;
}
.nom-btn:active { background: var(--green-light); border-color: var(--green); }

/* Leaderboard tab */
.lb-body { flex: 1; overflow-y: auto; background: var(--white); }
.lb-header {
  display: flex; align-items: center; padding: 12px 16px;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--muted); border-bottom: 1px solid var(--line);
}
.lb-header .lb-pos { width: 36px; }
.lb-header .lb-name { flex: 1; }
.lb-header .lb-thru { width: 44px; text-align: center; }
.lb-header .lb-pts { width: 44px; text-align: right; }
.lb-row {
  display: flex; align-items: center; padding: 12px 16px;
  font-size: 14px; border-bottom: 1px solid var(--line);
}
.lb-row.is-me { background: var(--green-light); border-left: 3px solid var(--green); padding-left: 13px; }
.lb-row .lb-pos { width: 36px; font-weight: 700; color: var(--muted); }
.lb-row .lb-name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-row .lb-thru { width: 44px; text-align: center; font-size: 12px; color: var(--muted); }
.lb-row .lb-pts { width: 44px; text-align: right; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 16px; }
.lb-freeze { padding: 12px 16px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; border-bottom: 1px solid var(--line); }
.lb-footer { padding: 12px 16px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }

/* Find your name */
.find-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.find-search {
  margin: 12px 16px; padding: 14px 16px; font-size: 16px; border: 2px solid var(--line);
  border-radius: 10px; outline: none; font-family: inherit; background: var(--white);
}
.find-search:focus { border-color: var(--green); }
.find-list { flex: 1; overflow-y: auto; }
.find-item {
  padding: 16px; border-bottom: 1px solid var(--line); cursor: pointer;
  font-size: 16px; font-weight: 500;
}
.find-item:active { background: var(--green-light); }

/* Finish screen */
.finish-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; overflow-y: auto; }
.finish-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.finish-pts { font-family: 'Poppins', sans-serif; font-size: 48px; font-weight: 800; color: var(--green); margin-bottom: 4px; }
.finish-sub { font-size: 15px; color: var(--muted); font-weight: 400; text-align: center; line-height: 1.5; }
.missing-list { width: 100%; padding: 0 24px; margin-top: 16px; }
.missing-item {
  padding: 14px 16px; margin-bottom: 8px; background: #FFF8E1; border: 1px solid var(--amber);
  border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: #7A5A00;
}
.missing-item:active { opacity: 0.8; }

/* Bottom sheet dialog */
.sheet-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 200; align-items: flex-end; justify-content: center;
}
.sheet-overlay.show { display: flex; }
.sheet-card {
  background: var(--white); border-radius: 20px 20px 0 0; padding: 28px 24px;
  padding-bottom: max(28px, env(safe-area-inset-bottom));
  width: 100%; max-width: 500px; text-align: center;
}
.sheet-card .sheet-text { font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 24px; line-height: 1.5; }
.sheet-actions { display: flex; gap: 12px; }
.sheet-actions button {
  flex: 1; padding: 16px; border: none; border-radius: 12px;
  font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
}
.sheet-actions .btn-back { background: var(--off-white); color: var(--ink); border: 2px solid var(--line); }
.sheet-actions .btn-confirm { background: var(--green); color: #fff; }

/* Loading */
.loading-body { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--muted); font-weight: 500; }
</style>
</head>
<body>

<!-- LOADING -->
<div class="screen active" id="s-loading">
  <div class="top-bar">
    <span class="ev-name" id="lb-ev-0">Out of Bounds</span>
    <div></div>
    <img class="org-logo" alt="">
  </div>
  <div class="loading-body" id="loading-msg">Loading...</div>
</div>

<!-- FIND YOUR NAME -->
<div class="screen" id="s-find">
  <div class="top-bar">
    <span class="ev-name" id="find-ev"></span>
    <div></div>
    <img class="org-logo" alt="">
  </div>
  <div class="find-body">
    <input type="text" class="find-search" id="find-search" placeholder="Search players..." autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="find-list" id="find-list"></div>
  </div>
</div>

<!-- WELCOME -->
<div class="screen" id="s-welcome">
  <div class="top-bar">
    <span class="ev-name" id="wel-ev"></span>
    <div></div>
    <img class="org-logo" alt="">
  </div>
  <div class="welcome-body" id="wel-body"></div>
</div>

<!-- NOMINATION -->
<div class="screen" id="s-nominate">
  <div class="top-bar">
    <span class="ev-name" id="nom-ev"></span>
    <div></div>
    <img class="org-logo" alt="">
  </div>
  <div class="nom-body" id="nom-body"></div>
</div>

<!-- SCORING -->
<div class="screen" id="s-scoring">
  <div class="top-bar">
    <span class="ev-name" id="sc-ev"></span>
    <div class="tabs">
      <button class="tab active" id="tab-scoring">Scoring</button>
      <button class="tab" id="tab-lb">Leaderboard</button>
    </div>
    <img class="org-logo" alt="">
  </div>
  <!-- Scoring panel -->
  <div id="scoring-panel" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <div class="hole-bar">
      <button class="arrow" id="arr-prev"></button>
      <div class="hole-centre">
        <div class="hole-num" id="hole-num"></div>
        <div class="hole-meta" id="hole-meta"></div>
      </div>
      <button class="arrow" id="arr-next"></button>
    </div>
    <div class="player-rows" id="player-rows"></div>
    <div class="status-line" id="status-line">
      <span class="sl" id="status-l"></span>
      <span class="sr" id="status-r"></span>
    </div>
    <div class="keypad-wrap" id="keypad-wrap">
      <div class="keypad" id="keypad"></div>
    </div>
    <button class="save-bar" id="btn-save" disabled>Save hole</button>
  </div>
  <!-- Leaderboard panel (hidden by default) -->
  <div id="lb-panel" style="flex:1;display:none;flex-direction:column;overflow:hidden;">
    <div class="lb-body" id="lb-body"></div>
  </div>
</div>

<!-- READ-ONLY (non-scorer) -->
<div class="screen" id="s-readonly">
  <div class="top-bar">
    <span class="ev-name" id="ro-ev"></span>
    <div class="tabs">
      <button class="tab active" id="ro-tab-scoring">Scoring</button>
      <button class="tab" id="ro-tab-lb">Leaderboard</button>
    </div>
    <img class="org-logo" alt="">
  </div>
  <div id="ro-scoring-panel" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <div class="hole-bar" id="ro-hole-bar">
      <button class="arrow" id="ro-arr-prev"></button>
      <div class="hole-centre">
        <div class="hole-num" id="ro-hole-num"></div>
        <div class="hole-meta" id="ro-hole-meta"></div>
      </div>
      <button class="arrow" id="ro-arr-next"></button>
    </div>
    <div class="player-rows" id="ro-player-rows"></div>
    <div class="passive-area" id="ro-passive">
      <div class="pa-text" id="ro-pa-text"></div>
      <button class="pa-link" id="ro-takeover">Take over scoring</button>
    </div>
  </div>
  <div id="ro-lb-panel" style="flex:1;display:none;flex-direction:column;overflow:hidden;">
    <div class="lb-body" id="ro-lb-body"></div>
  </div>
</div>

<!-- FINISH -->
<div class="screen" id="s-finish">
  <div class="top-bar">
    <span class="ev-name" id="fin-ev"></span>
    <div></div>
    <img class="org-logo" alt="">
  </div>
  <div class="finish-body" id="fin-body"></div>
</div>

<!-- Bottom sheet dialog -->
<div class="sheet-overlay" id="sheet">
  <div class="sheet-card">
    <div class="sheet-text" id="sheet-text"></div>
    <div class="sheet-actions">
      <button class="btn-back" id="sheet-back">Go back</button>
      <button class="btn-confirm" id="sheet-yes">Yes</button>
    </div>
  </div>
</div>

<script src="/shared/engine.js"></script>
<script src="/shared/api.js"></script>
<script>
(function () {
  'use strict';

  /* ── Route ── */
  var parts = (location.hash || '').replace(/^#\/?/, '').split('/');
  var orgSlug   = parts[0] || '';
  var eventSlug = parts[1] || '';
  var token     = parts[2] || '';

  if (!orgSlug || !eventSlug) {
    document.getElementById('loading-msg').textContent = 'No event link found. Check the URL you were sent.';
    return;
  }

  /* ── State ── */
  var ctx = null;
  var config = null;
  var eventId = null;
  var currentHole = 1;
  var selectedIdx = 0;
  var holeScores = {};
  var savedHoles = {};
  var pendingFlush = false;
  var roTimer = null;

  var FORMAT_LABELS = {
    individual_stableford: 'Individual Stableford',
    better_ball_pairs: 'Better ball pairs',
    better_ball_2from4: 'Best 2 from 4'
  };

  /* ── Helpers ── */
  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }

  function showScreen(id) {
    var all = document.querySelectorAll('.screen');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
    document.getElementById(id).classList.add('active');
  }

  function setEventNames(name) {
    var els = document.querySelectorAll('.ev-name');
    for (var i = 0; i < els.length; i++) els[i].textContent = name || '';
  }

  function setOrgLogos(url) {
    if (!url) return;
    var els = document.querySelectorAll('.org-logo');
    for (var i = 0; i < els.length; i++) { els[i].src = url; els[i].style.display = ''; }
  }

  function holeOrder(start) {
    start = start || 1;
    var o = [];
    for (var i = 0; i < 18; i++) o.push(((start - 1 + i) % 18) + 1);
    return o;
  }

  function holeIdx(h, order) {
    for (var i = 0; i < order.length; i++) { if (order[i] === h) return i; }
    return -1;
  }

  function getHole(num) {
    var holes = (ctx.course && ctx.course.holes) || [];
    for (var i = 0; i < holes.length; i++) { if (holes[i].hole_number === num) return holes[i]; }
    return { hole_number: num, par: 4, stroke_index: num };
  }

  function members() { return (ctx.group && ctx.group.members) || []; }

  function getScore(pid, h) { return (holeScores[pid] && holeScores[pid][h]) || null; }

  function setScoreData(pid, h, gross, pu) {
    if (!holeScores[pid]) holeScores[pid] = {};
    holeScores[pid][h] = { gross: gross, pickedUp: pu };
  }

  function clearScoreData(pid, h) {
    if (holeScores[pid]) delete holeScores[pid][h];
  }

  function calcTotal() {
    var g = ctx.group || {};
    var order = holeOrder(g.starting_hole);
    var format = ctx.event ? ctx.event.format : 'individual_stableford';
    var ms = members();
    var total = 0;
    var holesCompleted = 0;

    order.forEach(function (h) {
      var hd = getHole(h);
      var allDone = ms.every(function (m) {
        var sd = getScore(m.id, h);
        return sd && (sd.gross || sd.pickedUp);
      });
      if (!allDone && h !== currentHole) { /* only count completed holes for "through" */ }
      if (allDone) holesCompleted++;

      if (format === 'better_ball_2from4') {
        var pts = [];
        ms.forEach(function (m) {
          var sd = getScore(m.id, h);
          if (!sd) { pts.push(0); return; }
          var shots = OOB.shotsOnHole(m.playing_handicap || 0, hd.stroke_index);
          pts.push(sd.pickedUp ? 0 : OOB.stablefordPoints(hd.par, sd.gross, shots));
        });
        pts.sort(function (a, b) { return b - a; });
        total += (pts[0] || 0) + (pts[1] || 0);
      } else if (format === 'better_ball_pairs') {
        var best = 0;
        ms.forEach(function (m) {
          var sd = getScore(m.id, h);
          if (!sd) return;
          var shots = OOB.shotsOnHole(m.playing_handicap || 0, hd.stroke_index);
          var p = sd.pickedUp ? 0 : OOB.stablefordPoints(hd.par, sd.gross, shots);
          if (p > best) best = p;
        });
        total += best;
      } else {
        ms.forEach(function (m) {
          var sd = getScore(m.id, h);
          if (!sd) return;
          var shots = OOB.shotsOnHole(m.playing_handicap || 0, hd.stroke_index);
          total += sd.pickedUp ? 0 : OOB.stablefordPoints(hd.par, sd.gross, shots);
        });
      }
    });

    return { total: total, holesCompleted: holesCompleted };
  }

  function savedCount() {
    var order = holeOrder((ctx.group || {}).starting_hole);
    var ms = members();
    var count = 0;
    order.forEach(function (h) {
      var allSaved = ms.every(function (m) { return savedHoles[m.id + '-' + h]; });
      if (allSaved) count++;
    });
    return count;
  }

  /* ── Offline buffer ── */
  function pendingKey(eId, pId, h) { return 'oob-pending-' + eId + '-' + pId + '-' + h; }

  function storePending(eId, scores) {
    scores.forEach(function (s) {
      localStorage.setItem(pendingKey(eId, s.player_id, s.hole_number), JSON.stringify(s));
    });
  }

  function getPendingKeys() {
    var keys = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('oob-pending-') === 0) keys.push(k);
    }
    return keys;
  }

  function getPendingHoleCount() {
    var keys = getPendingKeys();
    var holes = {};
    keys.forEach(function (k) {
      try {
        var s = JSON.parse(localStorage.getItem(k));
        if (s) holes[s.hole_number] = true;
      } catch (e) {}
    });
    return Object.keys(holes).length;
  }

  async function flushPending() {
    if (pendingFlush || !token) return;
    var keys = getPendingKeys();
    if (keys.length === 0) return;
    pendingFlush = true;

    var batch = [];
    keys.forEach(function (k) {
      try {
        var s = JSON.parse(localStorage.getItem(k));
        if (s) batch.push({ key: k, score: s });
      } catch (e) { localStorage.removeItem(k); }
    });

    if (batch.length === 0) { pendingFlush = false; return; }

    try {
      await OOB.api('score-save', {
        method: 'POST',
        body: { token: token, scores: batch.map(function (b) { return b.score; }) }
      });
      batch.forEach(function (b) { localStorage.removeItem(b.key); });
    } catch (err) {
      console.warn('Flush failed:', err.message);
    }
    pendingFlush = false;
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') flushPending();
  });

  /* ── Bottom sheet dialog ── */
  var sheetCb = null;

  function showSheet(text, yesLabel, onConfirm) {
    document.getElementById('sheet-text').textContent = text;
    document.getElementById('sheet-yes').textContent = yesLabel || 'Yes';
    document.getElementById('sheet').classList.add('show');
    sheetCb = onConfirm;
  }

  document.getElementById('sheet-back').onclick = function () {
    document.getElementById('sheet').classList.remove('show');
    sheetCb = null;
  };
  document.getElementById('sheet-yes').onclick = function () {
    document.getElementById('sheet').classList.remove('show');
    if (sheetCb) sheetCb();
    sheetCb = null;
  };

  /* ── INIT ── */
  async function init() {
    try {
      config = await OOB.api('config-get', { query: { org: orgSlug, event: eventSlug } });
      var org = config.organiser || {};
      var ev = config.event || {};
      eventId = ev.id;

      if (org.logo_url) setOrgLogos(org.logo_url);
      setEventNames(ev.name);

      if (!token) {
        await showFind(ev);
        return;
      }

      await loadContext();
    } catch (err) {
      document.getElementById('loading-msg').textContent = err.message || 'Failed to load. Check your connection.';
    }
  }

  /* ── FIND YOUR NAME ── */
  async function showFind(ev) {
    showScreen('s-find');
    document.getElementById('find-ev').textContent = ev.name || '';

    try {
      var data = await OOB.api('event-players', { query: { event: eventId } });
      var players = (data.players || []).sort(function (a, b) {
        return (a.display_name || '').localeCompare(b.display_name || '');
      });

      var listEl = document.getElementById('find-list');
      function render(filter) {
        var f = (filter || '').toLowerCase();
        var html = '';
        players.forEach(function (p) {
          if (f && (p.display_name || '').toLowerCase().indexOf(f) === -1) return;
          html += '<div class="find-item" data-token="' + esc(p.token) + '">' + esc(p.display_name) + '</div>';
        });
        if (!html) html = '<div style="padding:24px;text-align:center;color:var(--muted)">No players found</div>';
        listEl.innerHTML = html;
      }

      render('');
      document.getElementById('find-search').addEventListener('input', function () { render(this.value); });

      listEl.addEventListener('click', function (e) {
        var item = e.target.closest('.find-item');
        if (!item) return;
        var t = item.getAttribute('data-token');
        if (t) {
          token = t;
          location.hash = '#/' + orgSlug + '/' + eventSlug + '/' + t;
          loadContext();
        }
      });
    } catch (err) {
      document.getElementById('find-list').innerHTML = '<div style="padding:24px;color:var(--muted)">' + esc(err.message) + '</div>';
    }
  }

  /* ── LOAD CONTEXT ── */
  async function loadContext() {
    try {
      ctx = await OOB.api('player-context', { query: { token: token } });
    } catch (err) {
      document.getElementById('loading-msg').textContent = err.message || 'Could not load player data.';
      showScreen('s-loading');
      return;
    }

    if (ctx.organiser && ctx.organiser.logo_url) setOrgLogos(ctx.organiser.logo_url);
    if (ctx.event) setEventNames(ctx.event.name);

    // Load existing scores
    if (ctx.scores) {
      ctx.scores.forEach(function (s) {
        if (!holeScores[s.player_id]) holeScores[s.player_id] = {};
        holeScores[s.player_id][s.hole_number] = {
          gross: s.picked_up ? null : s.gross_score,
          pickedUp: !!s.picked_up
        };
        savedHoles[s.player_id + '-' + s.hole_number] = true;
      });
    }

    flushPending();
    showWelcome();
  }

  /* ── WELCOME ── */
  function showWelcome() {
    showScreen('s-welcome');
    var p = ctx.player;
    var ev = ctx.event;
    var g = ctx.group;
    var ms = members();

    document.getElementById('wel-ev').textContent = ev.name || '';

    var html = '';
    html += '<div class="w-greeting">Welcome, ' + esc(p.first_name || p.display_name) + '</div>';
    html += '<div class="w-event">' + esc(ev.name || '') + '</div>';

    // Venue line — we don't have venue name in context, skip if not available
    // Group / tee time / playing partners
    if (g) {
      var detailParts = [];
      if (g.group_number) detailParts.push('Group ' + g.group_number);
      if (g.tee_time) detailParts.push(g.tee_time.slice(0, 5));

      var partners = ms.filter(function (m) { return m.id !== p.id; });
      if (partners.length > 0) {
        detailParts.push('playing with ' + partners.map(function (m) { return esc(m.display_name); }).join(', '));
      }
      if (detailParts.length > 0) {
        html += '<div class="w-detail">' + detailParts.join(' \u00B7 ') + '</div>';
      }
    }

    // Handicap
    var hasScores = ctx.scores && ctx.scores.length > 0;
    if (p.handicap_index != null) {
      html += '<div class="w-hcp">You play off ' + (p.playing_handicap || 0) + ' today.</div>';
    }

    html += '<button class="btn-go" id="btn-go">Let\'s go</button>';

    // "Not right?" link
    html += '<button class="w-notright" id="btn-notright">Not right?</button>';

    // HCP editor (hidden by default)
    html += '<div id="hcp-editor-area" style="display:none;"></div>';

    document.getElementById('wel-body').innerHTML = html;

    // HCP editor toggle
    document.getElementById('btn-notright').onclick = function () {
      var area = document.getElementById('hcp-editor-area');
      if (area.style.display !== 'none') { area.style.display = 'none'; return; }

      if (hasScores) {
        area.innerHTML = '<div class="hcp-editor"><div class="hcp-note">Ask the organiser to change this.</div></div>';
        area.style.display = '';
      } else {
        area.innerHTML = '<div class="hcp-editor">' +
          '<label for="hcp-field">Handicap index</label>' +
          '<input type="number" id="hcp-field" step="0.1" min="0" max="54" placeholder="e.g. 24" value="' + (p.handicap_index != null ? p.handicap_index : '') + '">' +
          '<div class="hcp-note">Locked once a score exists</div></div>';
        area.style.display = '';
      }
    };

    // Let's go
    document.getElementById('btn-go').onclick = function () {
      // Save handicap if edited
      var field = document.getElementById('hcp-field');
      if (field && field.value) {
        var val = parseFloat(field.value);
        if (!isNaN(val) && val >= 0 && val <= 54) {
          ctx.player.handicap_index = val;
          if (ctx.tee && ctx.course && ctx.course.holes.length > 0) {
            var allowance = ctx.event.handicap_allowance != null ? ctx.event.handicap_allowance : 0.95;
            ctx.player.playing_handicap = OOB.playingHandicap(
              val, ctx.tee.slope, ctx.tee.rating, ctx.tee.par_total, allowance, ctx.event.max_handicap || 54
            );
            ms.forEach(function (m) {
              if (m.id === ctx.player.id) m.playing_handicap = ctx.player.playing_handicap;
            });
          }
        }
      }

      if (g && !g.scorer_player_id) {
        showNominate();
      } else if (g && g.scorer_player_id === p.id) {
        enterScoring();
      } else {
        enterReadOnly();
      }
    };
  }

  /* ── NOMINATION ── */
  function showNominate() {
    showScreen('s-nominate');
    document.getElementById('nom-ev').textContent = (ctx.event || {}).name || '';

    var ms = members();
    var html = '<div class="nom-title">Who\'s keeping score for your group?</div>';
    ms.forEach(function (m) {
      html += '<button class="nom-btn" data-id="' + esc(m.id) + '">' + esc(m.display_name) + '</button>';
    });
    document.getElementById('nom-body').innerHTML = html;

    document.getElementById('nom-body').addEventListener('click', async function (e) {
      var btn = e.target.closest('.nom-btn');
      if (!btn) return;
      var sid = btn.getAttribute('data-id');
      btn.textContent = 'Setting up...';
      btn.disabled = true;

      try {
        await OOB.api('player-nominate', {
          method: 'POST',
          body: { token: token, scorer_player_id: sid }
        });
        ctx.group.scorer_player_id = sid;
        if (sid === ctx.player.id) { enterScoring(); } else { enterReadOnly(); }
      } catch (err) {
        btn.textContent = 'Failed \u2014 tap to retry';
        btn.disabled = false;
      }
    });
  }

  /* ── SCORING ── */
  function enterScoring() {
    showScreen('s-scoring');
    document.getElementById('sc-ev').textContent = (ctx.event || {}).name || '';

    var g = ctx.group || {};
    var order = holeOrder(g.starting_hole);
    var ms = members();
    currentHole = order[0];

    // Find first unscored hole
    for (var i = 0; i < order.length; i++) {
      var allDone = ms.every(function (m) { return getScore(m.id, order[i]) && (getScore(m.id, order[i]).gross || getScore(m.id, order[i]).pickedUp); });
      if (!allDone) { currentHole = order[i]; break; }
    }

    selectedIdx = 0;
    buildKeypad();
    renderHole();
    loadLeaderboard();

    // Tab switching
    document.getElementById('tab-scoring').onclick = function () {
      document.getElementById('tab-scoring').classList.add('active');
      document.getElementById('tab-lb').classList.remove('active');
      document.getElementById('scoring-panel').style.display = 'flex';
      document.getElementById('lb-panel').style.display = 'none';
    };
    document.getElementById('tab-lb').onclick = function () {
      document.getElementById('tab-lb').classList.add('active');
      document.getElementById('tab-scoring').classList.remove('active');
      document.getElementById('scoring-panel').style.display = 'none';
      document.getElementById('lb-panel').style.display = 'flex';
      loadLeaderboard();
    };

    // Navigation
    document.getElementById('arr-prev').onclick = function () {
      var idx = holeIdx(currentHole, order);
      if (idx > 0) { currentHole = order[idx - 1]; selectedIdx = 0; renderHole(); }
    };
    document.getElementById('arr-next').onclick = function () {
      var idx = holeIdx(currentHole, order);
      if (idx < order.length - 1) { currentHole = order[idx + 1]; selectedIdx = 0; renderHole(); }
    };

    // Save
    document.getElementById('btn-save').onclick = function () { saveCurrentHole(); };
  }

  function renderHole() {
    var g = ctx.group || {};
    var order = holeOrder(g.starting_hole);
    var idx = holeIdx(currentHole, order);
    var hd = getHole(currentHole);
    var ms = members();

    // Hole bar
    document.getElementById('hole-num').textContent = 'Hole ' + currentHole;
    document.getElementById('hole-meta').textContent = 'Par ' + hd.par + ' \u00B7 SI ' + hd.stroke_index;

    // Arrows
    var prevBtn = document.getElementById('arr-prev');
    var nextBtn = document.getElementById('arr-next');
    if (idx <= 0) { prevBtn.disabled = true; prevBtn.innerHTML = ''; }
    else { prevBtn.disabled = false; prevBtn.innerHTML = '\u2039 Hole ' + order[idx - 1]; }
    if (idx >= order.length - 1) { nextBtn.disabled = true; nextBtn.innerHTML = ''; }
    else { nextBtn.disabled = false; nextBtn.innerHTML = 'Hole ' + order[idx + 1] + ' \u203A'; }

    // Player rows
    var rowsHtml = '';
    ms.forEach(function (m, mIdx) {
      var ph = m.playing_handicap || 0;
      var shots = OOB.shotsOnHole(ph, hd.stroke_index);
      var sd = getScore(m.id, currentHole);
      var gross = sd ? sd.gross : null;
      var pu = sd ? sd.pickedUp : false;
      var isSelected = mIdx === selectedIdx;

      // Shot dots
      var dotsHtml = '';
      if (shots > 0) {
        if (shots <= 3) {
          for (var d = 0; d < shots; d++) dotsHtml += '<span class="shot-dot"></span>';
        } else {
          for (var d = 0; d < 3; d++) dotsHtml += '<span class="shot-dot"></span>';
          dotsHtml += '<span class="extra">+' + (shots - 3) + '</span>';
        }
      }

      // Score box
      var boxClass = 'score-box';
      var boxContent = '';
      if (pu) { boxClass += ' pickup'; boxContent = 'X'; }
      else if (gross) { boxClass += ' has-val'; boxContent = gross; }

      var tipText = 'Index ' + (m.handicap_index != null ? m.handicap_index : '?') + ' \u2192 plays off ' + (m.playing_handicap || '?');
      rowsHtml += '<div class="player-row' + (isSelected ? ' selected' : '') + '" data-idx="' + mIdx + '">' +
        '<span class="p-name" data-tip="' + esc(tipText) + '">' + esc(m.display_name) + '</span>' +
        '<span class="hcp-tooltip" id="tip-' + mIdx + '">' + esc(tipText) + '</span>' +
        '<div class="p-right">' +
        '<div class="shot-dots">' + dotsHtml + '</div>' +
        '<div class="' + boxClass + '">' + boxContent + '</div>' +
        '</div></div>';
    });
    document.getElementById('player-rows').innerHTML = rowsHtml;

    // Row tap to select + tooltip on name tap
    document.getElementById('player-rows').onclick = function (e) {
      var row = e.target.closest('.player-row');
      if (!row) return;
      var idx = parseInt(row.getAttribute('data-idx'), 10);
      selectedIdx = idx;
      renderHole();
      // Show tooltip if they tapped the name
      if (e.target.classList.contains('p-name')) {
        var tip = document.getElementById('tip-' + idx);
        if (tip) {
          tip.classList.add('show');
          setTimeout(function () { tip.classList.remove('show'); }, 2000);
        }
      }
    };

    // Status line
    var info = calcTotal();
    var format = (ctx.event || {}).format || 'individual_stableford';
    var formatShort = FORMAT_LABELS[format] || format;
    var statusL = formatShort + ' \u00B7 ' + info.total + ' pts through ' + info.holesCompleted;
    var saved = savedCount();
    var statusR = saved + ' of 18 saved';

    var pendingCount = getPendingHoleCount();
    var statusEl = document.getElementById('status-line');
    if (pendingCount > 0) {
      statusEl.classList.add('pending');
      document.getElementById('status-l').textContent = pendingCount + ' hole' + (pendingCount > 1 ? 's' : '') + ' on this phone, waiting for signal';
      document.getElementById('status-r').textContent = '';
    } else {
      statusEl.classList.remove('pending');
      document.getElementById('status-l').textContent = statusL;
      document.getElementById('status-r').textContent = statusR;
    }

    // Save button
    updateSaveButton();
  }

  function buildKeypad() {
    var keys = [
      { v: '1', label: '1' }, { v: '2', label: '2' }, { v: '3', label: '3' },
      { v: '4', label: '4' }, { v: '5', label: '5' }, { v: '6', label: '6' },
      { v: '7', label: '7' }, { v: '8', label: '8' }, { v: '9', label: '9' },
      { v: 'clear', label: 'Clear' }, { v: '0', label: '0' }, { v: 'X', label: 'X', sub: 'Pick up' }
    ];
    var html = '';
    keys.forEach(function (k) {
      html += '<button class="kp-key" data-val="' + k.v + '">' + k.label;
      if (k.sub) html += '<span class="kp-sub">' + k.sub + '</span>';
      html += '</button>';
    });
    document.getElementById('keypad').innerHTML = html;

    document.getElementById('keypad').onclick = function (e) {
      var key = e.target.closest('.kp-key');
      if (!key) return;
      var ms2 = members();
      if (ms2.length === 0) return;
      var pid = ms2[selectedIdx].id;
      var val = key.getAttribute('data-val');

      if (val === 'clear') {
        clearScoreData(pid, currentHole);
        renderHole();
        return;
      }

      if (val === 'X') {
        setScoreData(pid, currentHole, null, true);
        autoAdvance();
        renderHole();
        return;
      }

      var num = parseInt(val, 10);
      if (isNaN(num)) return;

      // Multi-digit: if existing single digit, combine
      var existing = getScore(pid, currentHole);
      if (existing && existing.gross && existing.gross < 10 && !existing.pickedUp && num > 0) {
        var combined = existing.gross * 10 + num;
        if (combined <= 20) num = combined;
      }

      if (num === 0) return;

      var hd = getHole(currentHole);

      // Guard: high score
      if (num > hd.par + 5) {
        showSheet(
          'That\'s a ' + num + ' on a par ' + hd.par + '. Sure?',
          'Yes, ' + num,
          function () { commitScore(pid, num); }
        );
        return;
      }

      // Guard: hole-in-one on par 4+
      if (num === 1 && hd.par >= 4) {
        showSheet(
          'A hole in one on a par ' + hd.par + '? Sure?',
          'Yes, 1',
          function () { commitScore(pid, num); }
        );
        return;
      }

      commitScore(pid, num);
    };
  }

  function commitScore(pid, gross) {
    setScoreData(pid, currentHole, gross, false);
    autoAdvance();
    renderHole();
  }

  function autoAdvance() {
    var ms2 = members();
    for (var j = 1; j <= ms2.length; j++) {
      var ni = (selectedIdx + j) % ms2.length;
      var sd = getScore(ms2[ni].id, currentHole);
      if (!sd || (!sd.gross && !sd.pickedUp)) {
        selectedIdx = ni;
        return;
      }
    }
  }

  function updateSaveButton() {
    var ms2 = members();
    var btn = document.getElementById('btn-save');
    var missing = [];
    ms2.forEach(function (m) {
      var sd = getScore(m.id, currentHole);
      if (!sd || (!sd.gross && !sd.pickedUp)) missing.push(m.first_name || m.display_name.split(' ')[0]);
    });

    if (missing.length > 0) {
      btn.disabled = true;
      btn.textContent = 'Enter a score for ' + missing[0];
    } else {
      btn.disabled = false;
      btn.textContent = 'Save hole';
    }
  }

  async function saveCurrentHole() {
    var ms2 = members();
    var scores = [];
    ms2.forEach(function (m) {
      var sd = getScore(m.id, currentHole);
      if (!sd) return;
      var entry = { player_id: m.id, hole_number: currentHole };
      if (sd.pickedUp) { entry.picked_up = true; }
      else { entry.gross_score = sd.gross; }
      scores.push(entry);
    });

    if (scores.length === 0) return;

    var btn = document.getElementById('btn-save');
    btn.textContent = '\u2713';
    btn.disabled = true;

    try {
      await OOB.api('score-save', {
        method: 'POST',
        body: { token: token, scores: scores }
      });
      scores.forEach(function (s) { savedHoles[s.player_id + '-' + s.hole_number] = true; });
      flushPending();
    } catch (err) {
      storePending(ctx.event.id, scores);
      scores.forEach(function (s) { savedHoles[s.player_id + '-' + s.hole_number] = true; });
    }

    advanceAfterSave();
  }

  function advanceAfterSave() {
    var order = holeOrder((ctx.group || {}).starting_hole);
    var idx = holeIdx(currentHole, order);

    if (idx >= order.length - 1) {
      checkFinish();
      return;
    }

    currentHole = order[idx + 1];
    selectedIdx = 0;
    renderHole();
    loadLeaderboard();
  }

  /* ── FINISH ── */
  function checkFinish() {
    var order = holeOrder((ctx.group || {}).starting_hole);
    var ms2 = members();
    var missing = [];

    order.forEach(function (h) {
      ms2.forEach(function (m) {
        var sd = getScore(m.id, h);
        if (!sd || (!sd.gross && !sd.pickedUp)) {
          missing.push({ hole: h, name: m.display_name });
        }
      });
    });

    // Block if pending
    if (getPendingHoleCount() > 0) {
      renderHole();
      return;
    }

    showScreen('s-finish');
    document.getElementById('fin-ev').textContent = (ctx.event || {}).name || '';

    if (missing.length > 0) {
      var html = '<div class="finish-title">Almost there</div>' +
        '<div class="finish-sub">Some scores are missing. Tap to fill them in.</div>' +
        '<div class="missing-list" id="miss-list">';
      missing.forEach(function (m) {
        html += '<div class="missing-item" data-hole="' + m.hole + '">Hole ' + m.hole + ': ' + esc(m.name) + ' \u2014 no score</div>';
      });
      html += '</div>';
      document.getElementById('fin-body').innerHTML = html;

      document.getElementById('miss-list').onclick = function (e) {
        var item = e.target.closest('.missing-item');
        if (!item) return;
        currentHole = parseInt(item.getAttribute('data-hole'), 10);
        selectedIdx = 0;
        enterScoring();
      };
      return;
    }

    // Complete
    var info = calcTotal();
    var format = (ctx.event || {}).format || 'individual_stableford';
    var formatLabel = FORMAT_LABELS[format] || '';
    var html = '<div class="finish-title">Round complete!</div>' +
      '<div class="finish-pts">' + info.total + ' pts</div>' +
      '<div class="finish-sub">Well played.' + (formatLabel ? ' ' + formatLabel + '.' : '') + '</div>';
    document.getElementById('fin-body').innerHTML = html;
  }

  /* ── READ-ONLY (non-scorer) ── */
  function enterReadOnly() {
    showScreen('s-readonly');
    document.getElementById('ro-ev').textContent = (ctx.event || {}).name || '';

    var g = ctx.group || {};
    var ms2 = members();
    var order = holeOrder(g.starting_hole);
    currentHole = order[0];

    // Find scorer name
    var scorerName = '';
    ms2.forEach(function (m) { if (m.id === g.scorer_player_id) scorerName = m.display_name; });
    document.getElementById('ro-pa-text').textContent = (scorerName || 'Someone') + ' is keeping score. Scores appear here as she enters them.';

    renderReadOnly();

    // Tab switching
    document.getElementById('ro-tab-scoring').onclick = function () {
      document.getElementById('ro-tab-scoring').classList.add('active');
      document.getElementById('ro-tab-lb').classList.remove('active');
      document.getElementById('ro-scoring-panel').style.display = 'flex';
      document.getElementById('ro-lb-panel').style.display = 'none';
    };
    document.getElementById('ro-tab-lb').onclick = function () {
      document.getElementById('ro-tab-lb').classList.add('active');
      document.getElementById('ro-tab-scoring').classList.remove('active');
      document.getElementById('ro-scoring-panel').style.display = 'none';
      document.getElementById('ro-lb-panel').style.display = 'flex';
      loadLeaderboard('ro-lb-body');
    };

    // Navigation
    document.getElementById('ro-arr-prev').onclick = function () {
      var idx = holeIdx(currentHole, order);
      if (idx > 0) { currentHole = order[idx - 1]; renderReadOnly(); }
    };
    document.getElementById('ro-arr-next').onclick = function () {
      var idx = holeIdx(currentHole, order);
      if (idx < order.length - 1) { currentHole = order[idx + 1]; renderReadOnly(); }
    };

    // Take over
    document.getElementById('ro-takeover').onclick = function () {
      showSheet(
        'Take over scoring from ' + (scorerName || 'the current scorer') + '?',
        'Yes, take over',
        async function () {
          try {
            await OOB.api('player-nominate', {
              method: 'POST',
              body: { token: token, scorer_player_id: ctx.player.id }
            });
            ctx.group.scorer_player_id = ctx.player.id;
            if (roTimer) { clearInterval(roTimer); roTimer = null; }
            enterScoring();
          } catch (err) {
            // silent fail
          }
        }
      );
    };

    // Poll every 30s
    if (roTimer) clearInterval(roTimer);
    roTimer = setInterval(async function () {
      try {
        ctx = await OOB.api('player-context', { query: { token: token } });
        holeScores = {};
        if (ctx.scores) {
          ctx.scores.forEach(function (s) {
            if (!holeScores[s.player_id]) holeScores[s.player_id] = {};
            holeScores[s.player_id][s.hole_number] = {
              gross: s.picked_up ? null : s.gross_score,
              pickedUp: !!s.picked_up
            };
          });
        }
        renderReadOnly();
      } catch (err) { console.warn('Poll failed:', err.message); }
    }, 30000);
  }

  function renderReadOnly() {
    var g = ctx.group || {};
    var order = holeOrder(g.starting_hole);
    var idx = holeIdx(currentHole, order);
    var hd = getHole(currentHole);
    var ms2 = members();

    // Hole bar
    document.getElementById('ro-hole-num').textContent = 'Hole ' + currentHole;
    document.getElementById('ro-hole-meta').textContent = 'Par ' + hd.par + ' \u00B7 SI ' + hd.stroke_index;

    var prevBtn = document.getElementById('ro-arr-prev');
    var nextBtn = document.getElementById('ro-arr-next');
    if (idx <= 0) { prevBtn.disabled = true; prevBtn.innerHTML = ''; }
    else { prevBtn.disabled = false; prevBtn.innerHTML = '\u2039 Hole ' + order[idx - 1]; }
    if (idx >= order.length - 1) { nextBtn.disabled = true; nextBtn.innerHTML = ''; }
    else { nextBtn.disabled = false; nextBtn.innerHTML = 'Hole ' + order[idx + 1] + ' \u203A'; }

    // Player rows
    var rowsHtml = '';
    ms2.forEach(function (m) {
      var ph = m.playing_handicap || 0;
      var shots = OOB.shotsOnHole(ph, hd.stroke_index);
      var sd = getScore(m.id, currentHole);
      var gross = sd ? sd.gross : null;
      var pu = sd ? sd.pickedUp : false;

      var dotsHtml = '';
      if (shots > 0) {
        if (shots <= 3) { for (var d = 0; d < shots; d++) dotsHtml += '<span class="shot-dot"></span>'; }
        else { for (var d = 0; d < 3; d++) dotsHtml += '<span class="shot-dot"></span>'; dotsHtml += '<span class="extra">+' + (shots - 3) + '</span>'; }
      }

      var boxClass = 'score-box';
      var boxContent = '';
      if (pu) { boxClass += ' pickup'; boxContent = 'X'; }
      else if (gross) { boxClass += ' has-val'; boxContent = gross; }

      rowsHtml += '<div class="player-row">' +
        '<span class="p-name">' + esc(m.display_name) + '</span>' +
        '<div class="p-right">' +
        '<div class="shot-dots">' + dotsHtml + '</div>' +
        '<div class="' + boxClass + '">' + boxContent + '</div>' +
        '</div></div>';
    });
    document.getElementById('ro-player-rows').innerHTML = rowsHtml;
  }

  /* ── LEADERBOARD ── */
  async function loadLeaderboard(targetId) {
    if (!ctx || !ctx.event) return;
    targetId = targetId || 'lb-body';
    try {
      var data = await OOB.api('leaderboard', {
        query: { event: ctx.event.id, mode: 'player' }
      });
      var entries = (data.entries || []);
      var freezeHole = data.freezeHole || 18;
      var showFull = freezeHole >= 18;
      var format = data.format || ctx.event.format;
      var allowancePct = data.allowancePct || 95;

      var html = '';

      // Freeze note
      if (!showFull) {
        html += '<div class="lb-freeze">Scores shown to hole ' + freezeHole + '. Full results in the clubhouse.</div>';
      }

      // Header
      html += '<div class="lb-header">' +
        '<span class="lb-pos">Pos</span>' +
        '<span class="lb-name">Team</span>' +
        '<span class="lb-thru">Thru</span>' +
        '<span class="lb-pts">Pts</span></div>';

      var played = entries.filter(function (e) { return e.hasPlayed; });
      played.forEach(function (e, i) {
        var isMe = e.memberIds && e.memberIds.indexOf(ctx.player.id) !== -1;
        // Surnames joined with " / "
        var nameDisplay = (e.names || '').split(' & ').map(function (n) {
          var parts = n.trim().split(' ');
          return parts.length > 1 ? parts[parts.length - 1] : parts[0];
        }).join(' / ');

        html += '<div class="lb-row' + (isMe ? ' is-me' : '') + '">' +
          '<span class="lb-pos">' + (i + 1) + '</span>' +
          '<span class="lb-name">' + esc(nameDisplay) + '</span>' +
          '<span class="lb-thru">' + e.thru + '</span>' +
          '<span class="lb-pts">' + e.points + '</span></div>';
      });

      if (played.length === 0) {
        html += '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">No scores on the board yet</div>';
      }

      // Footer
      html += '<div class="lb-footer">' + (FORMAT_LABELS[format] || format) + ' \u00B7 ' + allowancePct + '% allowance</div>';

      document.getElementById(targetId).innerHTML = html;
    } catch (err) {
      console.warn('Leaderboard load failed:', err.message);
    }
  }

  /* ── GO ── */
  init();
})();
</script>
</body>
</html>
